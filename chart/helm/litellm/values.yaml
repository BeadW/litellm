# LiteLLM componentized chart — three independently scalable services.
# No subcharts: bring your own Postgres + Redis and wire them via `database` / `redis` below.

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

# Optional Ingress wiring the three component Services behind a single L7
# entrypoint. Required when serving the static UI bundle over the network —
# the bundle uses relative URLs (e.g. fetch /v1/models, /key/info), so it
# can't reach the gateway / backend Services if loaded from the UI's port
# directly. With ingress.enabled=true, requests are dispatched by path:
#   /, /favicon.ico, /litellm-asset-prefix/*, /_next/*  → ui
#   /v1/*, /openai/*, /chat/*, etc. (gateway data plane) → gateway
#   everything else (catch-all)                          → backend
# Path list mirrors gateway/routes/allowlist.py.
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""        # optional; if set, becomes the rule's host
  tls: []

# Shared ServiceAccount used by all three component Deployments. Set
# `create: true` to have the chart provision it (e.g. when wiring an EKS
# Pod Identity association by SA name). Set `name` to use an existing SA
# (chart-created or out-of-band). When both are empty / false, pods run
# with the namespace's `default` SA.
serviceAccount:
  create: false
  automount: true
  annotations: {}
  name: ""

# Required: a master key used by gateway + backend to mint/verify proxy tokens.
# Either set `masterKey.value` (chart will create a Secret) or set `masterKey.existingSecret`
# (chart will reference it; secret must contain key `master-key`).
masterKey:
  value: ""
  existingSecret: ""

# External Postgres connection. Required for the gateway and backend.
database:
  url: ""               # e.g. postgresql://user:pass@host:5432/litellm
  existingSecret: ""    # secret containing key `database-url`
  existingSecretKey: database-url

# Optional Redis (caching, rate limiting). Leave host empty to disable.
redis:
  host: ""
  port: 6379
  password: ""
  existingSecret: ""
  existingSecretKey: redis-password

# Extra env vars merged into all three deployments.
extraEnv: []
# - name: LITELLM_LOG_LEVEL
#   value: INFO

# ---------- gateway (LLM data plane) ----------
gateway:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/berriai/litellm-gateway
    tag: ""              # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 4000
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  livenessProbe:
    httpGet: { path: /health/liveliness, port: http }
    initialDelaySeconds: 10
    periodSeconds: 15
  readinessProbe:
    httpGet: { path: /health/readiness, port: http }
    initialDelaySeconds: 5
    periodSeconds: 10
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ---------- backend (UI / management API) ----------
backend:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/berriai/litellm-backend
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 4001
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  livenessProbe:
    httpGet: { path: /health/liveliness, port: http }
    initialDelaySeconds: 10
    periodSeconds: 15
  readinessProbe:
    httpGet: { path: /health/readiness, port: http }
    initialDelaySeconds: 5
    periodSeconds: 10
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ---------- ui (Next.js static dashboard) ----------
ui:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/berriai/litellm-ui
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  # The dashboard expects to know where to reach the backend API. Set this to
  # the externally-routable URL (typically the ingress host + /api or similar).
  backendUrl: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  livenessProbe:
    httpGet: { path: /, port: http }
    initialDelaySeconds: 5
    periodSeconds: 20
  readinessProbe:
    httpGet: { path: /, port: http }
    initialDelaySeconds: 2
    periodSeconds: 10
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
