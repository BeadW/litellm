{{- if .Values.migrationJob.enabled -}}
# Pre-install / pre-upgrade hook that runs `prisma migrate deploy` against
# the configured database. Required because the gateway and backend both
# spin up Prisma at startup and assume the LiteLLM schema (LiteLLM_Config,
# LiteLLM_VerificationToken, LiteLLM_SpendLogs, ...) already exists.
#
# Reuses the backend image (which has prisma + the schema bundled) and the
# shared serviceAccountName, so EKS Pod Identity supplies the AWS creds for
# IAM-auth DB connections the same way the runtime pods do. The serverEnv
# helper injects DATABASE_HOST/PORT/USER/NAME and IAM_TOKEN_DB_AUTH;
# litellm/proxy/prisma_migration.py runs through proxy_cli's startup path,
# which constructs DATABASE_URL from those vars before invoking prisma.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "litellm.fullname" . }}-migrations
  labels:
    {{- include "litellm.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    # post-install / post-upgrade so the chart's regular resources
    # (ServiceAccount in particular) are applied first — a pre-install hook
    # would race against the SA template and the Job pod fails to schedule
    # with `serviceaccount "<name>" not found`. The race the other way
    # (gateway / backend pods trying to query Prisma before the schema
    # exists) self-resolves: prisma_migration.py finishes in ~10s while
    # pod imports take ~60s, and any pod that does crash backs off and
    # retries successfully once the Job completes.
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/hook-weight: "0"
spec:
  backoffLimit: {{ .Values.migrationJob.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.migrationJob.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "litellm.commonLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "litellm.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: prisma-migrations
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          workingDir: /app
          command: ["python", "litellm/proxy/prisma_migration.py"]
          env:
            {{- include "litellm.serverEnv" . | nindent 12 }}
            # Force the migration to run even if a prior pod set
            # DISABLE_SCHEMA_UPDATE=true to skip auto-migrations at runtime.
            - name: DISABLE_SCHEMA_UPDATE
              value: "false"
          {{- with .Values.migrationJob.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
